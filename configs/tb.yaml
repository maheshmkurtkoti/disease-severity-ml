disease: tuberculosis
task: severity_classification

data:
  dataset: montgomery_shenzhen
  image_size: 224
  num_classes: 3
  class_names: ["Mild", "Moderate", "Severe"]
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

  # Severity mapping based on TB radiological scoring
  # Mild:     < 1/3 of one lung affected
  # Moderate: 1/3 to 2/3 of one lung OR < 1/3 of both lungs
  # Severe:   > 2/3 total lung volume affected
  severity_thresholds:
    mild_max_coverage: 0.33
    moderate_max_coverage: 0.66

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3
  freeze_backbone_epochs: 2

training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 7

augmentation:
  horizontal_flip: true
  rotation_limit: 10
  brightness_contrast: true
  clahe: true           # Contrast Limited AHE — good for X-rays
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

paths:
  data_dir: data/raw/tb
  processed_dir: data/processed/tb
  model_save_dir: models/tb
  logs_dir: logs/tb
